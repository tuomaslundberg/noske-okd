# Deployment — NSE pod spec with init container for corpus download
#
# A Deployment declares desired state for a set of identical pods. The
# controller reconciles actual state toward it: if a pod dies, a replacement
# is scheduled. replicas: 1 is intentional for a stateful corpus server —
# multiple replicas reading from one PVC is fine; multiple writing is not.
#
# Init containers run to completion in order before the main container starts.
# Kubernetes restarts the pod (and re-runs init containers) on failure, so
# the corpus-init container checks whether the corpus is already present on the
# PVC to avoid re-downloading on every restart.
#
# Corpus loading strategy (Session 3+):
#   Corpora are pre-compiled on LUMI-C (via Apptainer + compilecorp) and
#   uploaded to LUMI-O object storage. The init container downloads the
#   compiled corpus at pod startup using rclone (S3-compatible). Credentials
#   are injected from the lumi-o-credentials Secret (00-secret.yaml).
#
# securityContext: OKD enforces arbitrary UIDs — it overrides runAsUser at
# runtime to a random UID from the namespace's allowed range. Setting
# runAsNonRoot: true here signals the intent and causes OKD to reject an image
# that would run as root. The patched image (Dockerfile.okd) already handles
# arbitrary UIDs via chown 0:0 + chmod g=u on all writable dirs.
#
# Resource requests/limits: requests are what the scheduler uses to place the
# pod on a node; limits are enforced hard caps. NSE can be memory-hungry under
# real load — 8 GiB limit is the safe ceiling within the LimitRange max of
# 16 GiB. Adjust for production.
#
# BROWSER_URL_BONITO: OKD auto-names Routes as
# <route-name>-<namespace>.apps.<cluster-domain>. Based on the cluster API at
# api.v1.lumi-k.eu and the confirmed apps domain *.apps.lumi-k.eu, the Route
# "noske" in namespace "turkunlp-noske-dev" should resolve to the URL below.
# Verify with: oc get route noske -n turkunlp-noske-dev -o jsonpath='{.spec.host}'
# Update this value if it differs before applying the manifest.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: noske
  namespace: turkunlp-noske-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noske
  template:
    metadata:
      labels:
        app: noske
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: corpus-init
          image: ghcr.io/tuomaslundberg/noske-okd:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # rclone picks up S3 credentials from these env vars automatically
            # when using the :s3: connection string syntax (no config file needed).
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lumi-o-credentials
                  key: access-key-id
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lumi-o-credentials
                  key: secret-access-key
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Skip if corpus already present on PVC (persists across restarts)
              if [ -d /var/lib/manatee/data/hplt_toy ] && \
                 [ -n "$(ls -A /var/lib/manatee/data/hplt_toy 2>/dev/null)" ]; then
                echo "Corpus 'hplt_toy' already present on PVC, skipping download."
                exit 0
              fi
              mkdir -p /var/lib/manatee/data/hplt_toy
              echo "Downloading corpus 'hplt_toy' from LUMI-O..."
              rclone copy \
                --s3-provider Ceph \
                --s3-endpoint https://lumidata.eu \
                :s3:turkunlp-noske-corpora/hplt_toy/ \
                /var/lib/manatee/data/hplt_toy/ \
                --progress
              echo "Corpus 'hplt_toy' downloaded successfully."
          volumeMounts:
            - name: corpus-data
              mountPath: /var/lib/manatee/data
            - name: registry-config
              mountPath: /var/lib/manatee/registry

      containers:
        - name: noske
          image: ghcr.io/tuomaslundberg/noske-okd:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: CORPLIST
              value: "hplt_toy"
            # VERIFY: check actual route hostname with:
            #   oc get route noske -n turkunlp-noske-dev -o jsonpath='{.spec.host}'
            - name: BROWSER_URL_BONITO
              value: "https://noske-turkunlp-noske-dev.apps.lumi-k.eu"
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: corpus-data
              mountPath: /var/lib/manatee/data
            - name: registry-config
              mountPath: /var/lib/manatee/registry
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: corpus-data
          persistentVolumeClaim:
            claimName: noske-corpus
        - name: registry-config
          configMap:
            name: noske-registry
