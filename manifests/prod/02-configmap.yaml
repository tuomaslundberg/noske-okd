# ConfigMap — manatee registry for production corpora
# BEFORE APPLYING: replace PROD_NAMESPACE below.
# Add registry entries here as corpora are decided (post Veronika/Erik meeting).
# Source of truth for each registry: registry/<corpname> in the project repo.

apiVersion: v1
kind: ConfigMap
metadata:
  name: noske-registry
  namespace: PROD_NAMESPACE
data:
  hplt_toy: |
    NAME "HPLT Toy"
    ENCODING "UTF-8"
    PATH "/var/lib/manatee/data/hplt_toy"
    ATTRIBUTE word
    STRUCTURE doc {
        ATTRIBUTE id
        ATTRIBUTE lang
        ATTRIBUTE url
    }
    STRUCTURE s
