# Route — OKD ingress with automatic TLS
# BEFORE APPLYING: replace turkunlp-noske-prod below.
# Auto-assigned hostname: noske-turkunlp-noske-prod.apps.lumi-k.eu
# Verify with: oc get route noske -n turkunlp-noske-prod -o jsonpath='{.spec.host}'

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: noske
  namespace: turkunlp-noske-prod
spec:
  to:
    kind: Service
    name: noske
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
