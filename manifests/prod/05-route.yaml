# Route — OKD ingress with automatic TLS
# BEFORE APPLYING: replace PROD_NAMESPACE below.
# Auto-assigned hostname: noske-PROD_NAMESPACE.apps.lumi-k.eu
# Verify with: oc get route noske -n PROD_NAMESPACE -o jsonpath='{.spec.host}'

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: noske
  namespace: PROD_NAMESPACE
spec:
  to:
    kind: Service
    name: noske
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
