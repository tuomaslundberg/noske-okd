# Service — stable cluster-internal endpoint for the NSE pod
# BEFORE APPLYING: replace turkunlp-noske-prod below.

apiVersion: v1
kind: Service
metadata:
  name: noske
  namespace: turkunlp-noske-prod
spec:
  selector:
    app: noske
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
