# ConfigMap — manatee registry file for the HPLT toy corpus
#
# A ConfigMap stores key-value configuration data as a K8s object. It can be
# mounted into a pod as a directory: each key becomes a filename, its value
# the file content. Here, the key "hplt_toy" mounts as the file
# /var/lib/manatee/registry/hplt_toy — exactly what manatee's query tools
# expect when looking up a corpus named "hplt_toy".
#
# Manatee registry fields used here:
#   NAME      — human-readable label shown in the Crystal UI
#   ENCODING  — character encoding (corpus is UTF-8)
#   PATH      — directory where compiled corpus data lives (on the PVC)
#   ATTRIBUTE — positional attributes, one per token column in the vertical
#   STRUCTURE — structural attributes; fields listed become filterable metadata
#
# Source of truth: registry/hplt_toy in the project repo.
# VERTICAL is omitted here — it was only needed at compile time, not at runtime.

apiVersion: v1
kind: ConfigMap
metadata:
  name: noske-registry
  namespace: turkunlp-noske-dev
data:
  hplt_toy: |
    NAME "HPLT Toy"
    ENCODING "UTF-8"
    PATH "/var/lib/manatee/data/hplt_toy"
    ATTRIBUTE word
    STRUCTURE doc {
        ATTRIBUTE id
        ATTRIBUTE lang
        ATTRIBUTE url
    }
    STRUCTURE s
